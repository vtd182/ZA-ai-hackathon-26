<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0.05" x2="0.9" y2="0.98">
      <stop offset="0" stop-color="#3a90f7"/>
      <stop offset="0.5" stop-color="#0d6ee0"/>
      <stop offset="1" stop-color="#0a4fc0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="440" cy="512" r="196"/>
    </clipPath>
  </defs>
  <rect x="112" y="112" width="800" height="800" rx="210" fill="url(#bg)"/>
  <rect x="112" y="112" width="800" height="800" rx="210" fill="url(#sheen)"/>
  <!-- Dual minds: two overlapping discs; their intersection is the shared "insight" lens. -->
  <circle cx="440" cy="512" r="196" fill="#ffffff" fill-opacity="0.96"/>
  <circle cx="584" cy="512" r="196" fill="#bcd9ff" fill-opacity="0.72"/>
  <g clip-path="url(#lensClip)">
    <circle cx="584" cy="512" r="196" fill="#0d63d6" fill-opacity="0.92"/>
  </g>
</svg>
