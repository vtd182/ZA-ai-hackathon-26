name: release

# Push a version tag (e.g. v0.1.0) to build DualMind for macOS + Windows and publish a
# GitHub Release with the .dmg and .exe installers. The app version comes from
# apps/desktop/package.json — bump it before tagging so the tag matches.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  figma-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Figma plugin bundle
        working-directory: mcp-tool/za-talk-to-figma/plugin
        shell: bash
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit -p tsconfig.json
          bun run build

      - name: Stage Figma plugin files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/figma-plugin-files/dist" apps/desktop/release
          cp mcp-tool/za-talk-to-figma/plugin/manifest.json "$RUNNER_TEMP/figma-plugin-files/manifest.json"
          cp mcp-tool/za-talk-to-figma/plugin/dist/code.js "$RUNNER_TEMP/figma-plugin-files/dist/code.js"
          cp mcp-tool/za-talk-to-figma/plugin/dist/index.html "$RUNNER_TEMP/figma-plugin-files/dist/index.html"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/apps/desktop/release/za-talk-to-figma-plugin.zip" figma-plugin-files)

      - name: Upload Figma plugin files
        uses: actions/upload-artifact@v4
        with:
          name: figma-plugin-files
          path: ${{ runner.temp }}/figma-plugin-files

      - name: Upload Figma plugin release zip
        uses: actions/upload-artifact@v4
        with:
          name: release-figma-plugin
          path: apps/desktop/release/za-talk-to-figma-plugin.zip

  build-app:
    needs: figma-plugin
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Figma runtime (Go, per-OS)
        working-directory: mcp-tool/za-talk-to-figma
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o bin/za-talk-to-figma.exe ./cmd/za-talk-to-figma
          else
            go build -o bin/za-talk-to-figma ./cmd/za-talk-to-figma
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Download Figma plugin bundle
        uses: actions/download-artifact@v4
        with:
          name: figma-plugin-files
          path: ${{ runner.temp }}/figma-plugin-files

      - name: Prepare packaged resources
        env:
          PM_AGENT_FIGMA_PLUGIN_SOURCE: ${{ runner.temp }}/figma-plugin-files
        run: node scripts/prepare-package-assets.mjs --strict-figma

      - name: Package standalone Figma runtime
        shell: bash
        run: |
          mkdir -p apps/desktop/release
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path apps/desktop/out/package-resources/figma-runtime -DestinationPath apps/desktop/release/za-talk-to-figma-runtime-${RUNNER_OS}-${RUNNER_ARCH}.zip -Force"
          else
            (cd apps/desktop/out/package-resources && zip -qr "$GITHUB_WORKSPACE/apps/desktop/release/za-talk-to-figma-runtime-${RUNNER_OS}-${RUNNER_ARCH}.zip" figma-runtime)
          fi

      - name: Build DualMind
        working-directory: apps/desktop
        shell: bash
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --publish never

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/za-talk-to-figma-runtime-*.zip
          if-no-files-found: error

  publish-release:
    needs: [figma-plugin, build-app]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release draft
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          draft: true
          files: release-assets/*
